services:
  - type: web
    name: telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_render.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: USE_WEBHOOK
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"
    healthCheckPath: /health
